services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file:
      - .env
    environment:
      NOTIFICATION_HOST: 0.0.0.0

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      BOT_NOTIFICATION_URL: http://bot:3001/notify
    ports:
      - "3000:3000"
    depends_on:
      - bot